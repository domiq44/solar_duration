name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15

      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang-tidy cppcheck gcovr

      - name: Run tests
        run: make test

      - name: Measure source coverage
        run: make coverage

      - name: Test WebAssembly calculator
        run: make test_web_wasm

      - name: Run clang-tidy
        run: make lint

      - name: Run cppcheck
        run: make cppcheck